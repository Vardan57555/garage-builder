services:
  comfyui:
    build:
      context: ./Comfy
      dockerfile: Dockerfile
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - comfyui-models:/app/models
      - comfyui-output:/app/output
    networks:
      - garage-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8188/system_stats" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8g

  garage-backend:
    build: .
    container_name: garage-backend
    ports:
      - "5003:3000"
    environment:
      APP_PORT: 3000
      APP_HOST: http://localhost:5000
      NODE_ENV: development
      OLLAMA_API_HOST: http://ollama:11434
      COMFYUI_URL: http://comfyui:8188
      TEST_MODE: "true"
      CORS_ENABLED: "true"
      CORS_DOMAINS: http://localhost:5200
      FRONTEND_HOST: http://localhost:5200
      REQUEST_BODY_LIMIT: 5mb
      SESSION_SECRET: secret
      JWT_SECRET: jwt_secret
      MYSQL_DB_HOST: mysql
      MYSQL_DB_PORT: 3306
      MYSQL_DB: garage
      MYSQL_USER: pricing_engine
      MYSQL_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
      APP_NAME: garage-backend
    networks:
      - garage-network
    restart: always
    depends_on:
      comfyui:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - garage-network
    ports:
      - "11434:11434"
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: 4.0
          memory: 16g

  streamlit-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: streamlit-client
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://garage-backend:3000/api/v1/chat/
      IMAGE_GEN_URL: http://host.docker.internal:5001
    depends_on:
      - garage-backend
    networks:
      - garage-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: pricing_engine
      PMA_PASSWORD: secret
    ports:
      - '8080:80'
    networks:
      - garage-network
    restart: always

volumes:
  ollama-data:
  comfyui-models:
  comfyui-output:

networks:
  garage-network:
    driver: bridge
