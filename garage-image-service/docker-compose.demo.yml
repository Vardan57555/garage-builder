version: '3.8'

services:
  image-generator-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: garage-image-generator-demo
    environment:
      - PORT=5001
    ports:
      - "5001:5001"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
