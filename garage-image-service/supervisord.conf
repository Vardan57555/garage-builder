[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:download-models]
command=/bin/bash /app/service/download_models.sh
directory=/app/ComfyUI
autostart=true
autorestart=false
startsecs=0
stderr_logfile=/var/log/supervisor/download-models.err.log
stdout_logfile=/var/log/supervisor/download-models.out.log
priority=1

[program:comfyui]
command=python3 /app/ComfyUI/main.py --listen 0.0.0.0 --port 8188
directory=/app/ComfyUI
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/comfyui.err.log
stdout_logfile=/var/log/supervisor/comfyui.out.log
priority=2
depends_on=download-models

[program:image-service]
command=python3 /app/service/app.py
directory=/app/service
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/image-service.err.log
stdout_logfile=/var/log/supervisor/image-service.out.log
priority=3
environment=COMFYUI_URL="http://localhost:8188"
depends_on=comfyui
