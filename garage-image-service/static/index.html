<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
        }

        .result.active {
            display: block;
        }

        .result img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .result-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .result-info p {
            margin: 5px 0;
            color: #555;
        }

        .result-info strong {
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .gallery-item-info {
            padding: 10px;
            background: white;
        }

        .gallery-item-info p {
            font-size: 12px;
            color: #666;
            margin: 2px 0;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ Garage Image Generator</h1>
            <p>AI-powered visualization for garages and sheds</p>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px;">Generate Building Image</h2>
            
            <div class="error" id="error"></div>

            <form id="generateForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="buildingType">Building Type</label>
                        <select id="buildingType" required>
                            <option value="garage">Garage</option>
                            <option value="shed">Shed</option>
                            <option value="carport">Carport</option>
                            <option value="barn">Barn</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="width">Width (ft)</label>
                        <input type="number" id="width" value="20" min="8" max="60" required>
                    </div>

                    <div class="form-group">
                        <label for="length">Length (ft)</label>
                        <input type="number" id="length" value="24" min="8" max="60" required>
                    </div>

                    <div class="form-group">
                        <label for="height">Height (ft)</label>
                        <input type="number" id="height" value="10" min="6" max="20" required>
                    </div>

                    <div class="form-group">
                        <label for="roofType">Roof Type</label>
                        <select id="roofType" required>
                            <option value="gable">Gable</option>
                            <option value="hip">Hip</option>
                            <option value="gambrel">Gambrel</option>
                            <option value="flat">Flat</option>
                            <option value="a-frame">A-Frame</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="color">Color</label>
                        <input type="text" id="color" value="white" required>
                    </div>

                    <div class="form-group">
                        <label for="style">Style</label>
                        <select id="style" required>
                            <option value="modern">Modern</option>
                            <option value="rustic">Rustic</option>
                            <option value="industrial">Industrial</option>
                            <option value="traditional">Traditional</option>
                            <option value="luxury">Luxury</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="lighting">Lighting</label>
                        <select id="lighting" required>
                            <option value="daylight">Daylight</option>
                            <option value="sunset">Sunset</option>
                            <option value="overcast">Overcast</option>
                            <option value="morning">Morning</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn" id="generateBtn">Generate Image</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating your building image...</p>
                <p style="font-size: 14px; color: #666; margin-top: 10px;">This may take 15-30 seconds</p>
            </div>

            <div class="result" id="result">
                <h3 style="margin-bottom: 15px;">Generated Image</h3>
                <img id="resultImage" src="" alt="Generated building">
                <div class="result-info">
                    <p><strong>Generation Time:</strong> <span id="genTime"></span>s</p>
                    <p><strong>Image Size:</strong> <span id="imgSize"></span></p>
                    <p><strong>Prompt:</strong> <span id="prompt" style="font-size: 12px;"></span></p>
                </div>
                <button class="btn" onclick="downloadImage()">Download Image</button>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px;">Recent Generations</h2>
            <div class="gallery" id="gallery"></div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let currentImageUrl = '';

        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                building_type: document.getElementById('buildingType').value,
                width: parseFloat(document.getElementById('width').value),
                length: parseFloat(document.getElementById('length').value),
                height: parseFloat(document.getElementById('height').value),
                roof_type: document.getElementById('roofType').value,
                color: document.getElementById('color').value,
                style: document.getElementById('style').value,
                lighting: document.getElementById('lighting').value,
                location: 'suburban area',
                additional_features: [],
                preview: false
            };

            // Hide error and result
            document.getElementById('error').classList.remove('active');
            document.getElementById('result').classList.remove('active');
            
            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('generateBtn').disabled = true;

            try {
                const response = await fetch(`${API_BASE}/generate-image`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error(`Generation failed: ${response.statusText}`);
                }

                const result = await response.json();
                
                // Display result
                currentImageUrl = result.file_url;
                document.getElementById('resultImage').src = result.file_url;
                document.getElementById('genTime').textContent = result.generation_time.toFixed(2);
                document.getElementById('imgSize').textContent = `${result.image_size.width}x${result.image_size.height}`;
                document.getElementById('prompt').textContent = result.prompt_used;
                
                document.getElementById('result').classList.add('active');
                
                // Refresh gallery
                loadGallery();

            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').classList.add('active');
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('generateBtn').disabled = false;
            }
        });

        async function loadGallery() {
            try {
                const response = await fetch(`${API_BASE}/outputs?limit=12`);
                const data = await response.json();
                
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';
                
                data.files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.innerHTML = `
                        <img src="${file.url}" alt="${file.filename}">
                        <div class="gallery-item-info">
                            <p><strong>${file.filename}</strong></p>
                            <p>${file.size_mb} MB</p>
                            <p>${new Date(file.created).toLocaleString()}</p>
                        </div>
                    `;
                    item.onclick = () => {
                        document.getElementById('resultImage').src = file.url;
                        document.getElementById('result').classList.add('active');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    gallery.appendChild(item);
                });
            } catch (error) {
                console.error('Failed to load gallery:', error);
            }
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.href = currentImageUrl;
            link.download = currentImageUrl.split('/').pop();
            link.click();
        }

        // Load gallery on page load
        loadGallery();
    </script>
</body>
</html>
